<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d6efd">
  <title>ระบบเช็กชื่อสแกนใบหน้า & QR Code ม.1 - ม.3</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- ไลบรารีสแกน QR Code -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <!-- ไลบรารี AI สแกนใบหน้า -->
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <style>
    body { 
      background-color: #f0f2f5; 
      font-family: 'Sarabun', sans-serif; 
      padding-bottom: 40px;
    }
    .datetime-banner {
      background: linear-gradient(135deg, #0d6efd, #0043a8);
      color: white;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
    }
    .clock-text { font-size: 2rem; font-weight: 700; letter-spacing: 1px; line-height: 1.1; }
    .date-text { font-size: 0.95rem; opacity: 0.95; }
    
    /* กล่องแสดงกล้องสแกนใบหน้า */
    .face-cam-wrapper {
      position: relative;
      width: 100%;
      max-width: 400px;
      margin: auto;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    #face-video { width: 100%; height: auto; display: block; }
    #face-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    .student-card {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      border-left: 5px solid #adb5bd;
    }
    .student-card.st-present { border-left-color: #198754; }
    .student-card.st-late { border-left-color: #ffc107; }
    .student-card.st-leave { border-left-color: #0dcaf0; }
    .student-card.st-absent { border-left-color: #dc3545; }

    .btn-action { flex: 1; padding: 8px 4px; font-weight: 600; font-size: 0.9rem; }
    .card-qr { break-inside: avoid; border: 1px dashed #999; padding: 10px; text-align: center; background: #fff; }
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      body { background-color: #fff; }
    }
    .print-only { display: none; }
  </style>
</head>
<body>

<div class="container py-2 px-3 no-print" style="max-width: 600px;">
  
  <!-- ส่วนหัวและนาฬิกา -->
  <div class="datetime-banner mb-3">
    <div class="d-flex justify-content-between align-items-center mb-1">
      <span class="fw-bold">📋 ระบบเช็กชื่อ ม.1 - ม.3</span>
      <button class="btn btn-light btn-sm fw-bold text-primary rounded-pill px-3" onclick="window.print()">
        🖨️ พิมพ์บัตร (<span id="print-label">ทั้งหมด</span>)
      </button>
    </div>
    <div class="text-center mt-2 pt-2 border-top border-light border-opacity-25">
      <div id="live-date" class="date-text">กำลังโหลดวันที่...</div>
      <div id="live-clock" class="clock-text">00:00:00</div>
    </div>
  </div>

  <!-- ปุ่มสลับโหมดการสแกน -->
  <div class="btn-group w-100 mb-2 shadow-sm">
    <button id="btn-mode-qr" class="btn btn-dark py-2 fw-bold" onclick="switchMode('QR')">📷 โหมดสแกน QR Code</button>
    <button id="btn-mode-face" class="btn btn-outline-dark py-2 fw-bold" onclick="switchMode('FACE')">😊 โหมดสแกนใบหน้า (AI)</button>
  </div>

  <!-- กล้องสแกน -->
  <div class="card border-0 shadow-sm rounded-4 mb-3">
    <div class="card-body text-center p-2">
      <!-- พื้นที่กล้อง QR -->
      <div id="qr-container">
        <div id="reader" style="width: 100%; border-radius: 12px; overflow: hidden;"></div>
      </div>
      <!-- พื้นที่กล้องใบหน้า -->
      <div id="face-container" style="display: none;">
        <div class="face-cam-wrapper">
          <video id="face-video" autoplay muted playsinline></video>
          <canvas id="face-canvas"></canvas>
        </div>
      </div>
      <div id="scan-alert" class="alert alert-secondary mt-2 mb-0 py-2 fw-bold small">กำลังเตรียมระบบกล้อง...</div>
    </div>
  </div>

  <!-- ตัวกรองระดับชั้น -->
  <div class="btn-group w-100 mb-3 shadow-sm" role="group">
    <button class="btn btn-primary grade-btn py-2 fw-bold" onclick="selectGrade('ALL', this)">ทั้งหมด</button>
    <button class="btn btn-light grade-btn py-2 fw-bold" onclick="selectGrade('ม.1', this)">ม.1</button>
    <button class="btn btn-light grade-btn py-2 fw-bold" onclick="selectGrade('ม.2', this)">ม.2</button>
    <button class="btn btn-light grade-btn py-2 fw-bold" onclick="selectGrade('ม.3', this)">ม.3</button>
  </div>

  <!-- สรุปยอด 4 สถานะ -->
  <div class="row g-2 mb-3 text-center">
    <div class="col-3"><div class="p-2 bg-success text-white rounded-3 shadow-sm"><small>มาเรียน</small><div id="cnt-present" class="fs-4 fw-bold">0</div></div></div>
    <div class="col-3"><div class="p-2 bg-warning text-dark rounded-3 shadow-sm"><small>มาสาย</small><div id="cnt-late" class="fs-4 fw-bold">0</div></div></div>
    <div class="col-3"><div class="p-2 bg-info text-dark rounded-3 shadow-sm"><small>ลา</small><div id="cnt-leave" class="fs-4 fw-bold">0</div></div></div>
    <div class="col-3"><div class="p-2 bg-danger text-white rounded-3 shadow-sm"><small>ขาด</small><div id="cnt-absent" class="fs-4 fw-bold">0</div></div></div>
  </div>

  <!-- ช่องค้นหาและปุ่มปิดเช็กชื่อ -->
  <div class="d-flex gap-2 mb-3">
    <input type="text" id="search-box" class="form-control rounded-3" placeholder="🔍 ค้นหาชื่อ หรือ เลขที่..." onkeyup="renderList()">
    <button class="btn btn-danger rounded-3 text-nowrap fw-bold" onclick="closeAttendance()">ปิดเช็กชื่อ</button>
  </div>

  <!-- รายชื่อนักเรียน -->
  <div id="student-list">
    <div class="text-center py-4 text-muted">กำลังโหลดรายชื่อนักเรียน...</div>
  </div>

</div>

<!-- ส่วนสำหรับสั่งพิมพ์บัตร QR Code -->
<div class="container print-only">
  <h4 class="text-center mb-3" id="print-title">บัตร QR Code ประจำตัวนักเรียน</h4>
  <div class="row g-3" id="qr-print-area"></div>
</div>

<script>
  // ⚠️ นำลิงก์ Web App URL จาก Google Apps Script มาวางแทนที่ข้อความด้านล่าง
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXORnt-WcA1zr4Y1wePG5jtZHpe2owWwk9bT4vj9VVTJEw1zOVKDuZ-8Na3OrzFiRhYg/exec";
  
  // โฟลเดอร์เก็บรูปนักเรียนบน GitHub (ชื่อไฟล์ต้องเป็น รหัสนักเรียน.jpg เช่น 67001.jpg)
  const FACE_FOLDER = "./faces/";

  let studentsData = [];
  let currentGrade = 'ALL';
  let currentMode = 'QR';
  let lastScannedId = "";
  let lastScanTime = 0;

  let html5QrCode = null;
  let faceMatcher = null;
  let faceModelsLoaded = false;
  let faceInterval = null;
  let videoStream = null;

  window.onload = () => {
    updateDateTime();
    setInterval(updateDateTime, 1000);
    loadData();
    startQRMode();
  };

  function updateDateTime() {
    const now = new Date();
    const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('live-date').innerText = now.toLocaleDateString('th-TH', dateOptions);
    document.getElementById('live-clock').innerText = now.toLocaleTimeString('th-TH', { hour12: false }) + ' น.';
  }

  // สลับโหมดระหว่าง QR Code กับ สแกนใบหน้า
  async function switchMode(mode) {
    if (currentMode === mode) return;
    currentMode = mode;

    // ปิดกล้องเดิมก่อน
    await stopAllCameras();

    if (mode === 'QR') {
      document.getElementById('btn-mode-qr').className = 'btn btn-dark py-2 fw-bold';
      document.getElementById('btn-mode-face').className = 'btn btn-outline-dark py-2 fw-bold';
      document.getElementById('qr-container').style.display = 'block';
      document.getElementById('face-container').style.display = 'none';
      startQRMode();
    } else {
      document.getElementById('btn-mode-qr').className = 'btn btn-outline-dark py-2 fw-bold';
      document.getElementById('btn-mode-face').className = 'btn btn-dark py-2 fw-bold';
      document.getElementById('qr-container').style.display = 'none';
      document.getElementById('face-container').style.display = 'block';
      startFaceMode();
    }
  }

  async function stopAllCameras() {
    if (html5QrCode) {
      try { await html5QrCode.stop(); } catch (e) {}
    }
    if (faceInterval) clearInterval(faceInterval);
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }
  }

  // --- โหมด 1: สแกน QR Code ---
  function startQRMode() {
    const alertBox = document.getElementById('scan-alert');
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      onScanSuccess
    ).then(() => {
      alertBox.className = 'alert alert-info mt-2 mb-0 py-2 fw-bold small';
      alertBox.innerText = '📷 กล้อง QR พร้อมใช้งาน! ส่องบัตรนักเรียนได้เลย';
    }).catch(() => {
      alertBox.className = 'alert alert-secondary mt-2 mb-0 py-2 small';
      alertBox.innerText = 'โหมดคอมพิวเตอร์ (เปิดบนมือถือเพื่อใช้งานกล้องสด)';
    });
  }

  // --- โหมด 2: สแกนใบหน้า AI ---
  async function startFaceMode() {
    const alertBox = document.getElementById('scan-alert');
    alertBox.className = 'alert alert-warning mt-2 mb-0 py-2 fw-bold small';
    alertBox.innerText = '⏳ กำลังโหลดระบบ AI จดจำใบหน้า (ครั้งแรกใช้เวลาประมาณ 5-10 วินาที)...';

    try {
      if (!faceModelsLoaded) {
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
        ]);
        faceModelsLoaded = true;
      }

      if (!faceMatcher) {
        alertBox.innerText = '⏳ กำลังประมวลผลฐานข้อมูลรูปหน้านักเรียน...';
        faceMatcher = await buildFaceMatcher();
      }

      if (!faceMatcher) {
        alertBox.className = 'alert alert-danger mt-2 mb-0 py-2 fw-bold small';
        alertBox.innerText = '⚠️ ยังไม่พบรูปนักเรียนในโฟลเดอร์ faces/ กรุณาอัปโหลดรูปก่อน';
        return;
      }

      const video = document.getElementById('face-video');
      videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = videoStream;

      video.onloadedmetadata = () => {
        alertBox.className = 'alert alert-success mt-2 mb-0 py-2 fw-bold small';
        alertBox.innerText = '😊 ระบบสแกนใบหน้าพร้อมแล้ว! หันหน้าเข้าหากล้องได้เลย';
        detectFaceLoop(video);
      };
    } catch (err) {
      alertBox.className = 'alert alert-danger mt-2 mb-0 py-2 small';
      alertBox.innerText = 'ไม่สามารถเปิดกล้องสแกนใบหน้าได้: ' + err.message;
    }
  }

  // โหลดรูปนักเรียนจากโฟลเดอร์ faces/ มาสร้างค่าใบหน้าอ้างอิง
  async function buildFaceMatcher() {
    const labeledDescriptors = [];
    for (const s of studentsData) {
      try {
        const imgUrl = `${FACE_FOLDER}${s.id}.jpg`;
        const img = await faceapi.fetchImage(imgUrl);
        const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
          .withFaceLandmarks()
          .withFaceDescriptor();
        if (detection) {
          labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(String(s.id), [detection.descriptor]));
        }
      } catch (e) {
        // ข้ามนักเรียนที่ยังไม่มีไฟล์รูป
      }
    }
    if (labeledDescriptors.length === 0) return null;
    return new faceapi.FaceMatcher(labeledDescriptors, 0.50); // ค่าความแม่นยำ 0.50
  }

  function detectFaceLoop(video) {
    const canvas = document.getElementById('face-canvas');
    const displaySize = { width: video.clientWidth, height: video.clientHeight };
    faceapi.matchDimensions(canvas, displaySize);

    faceInterval = setInterval(async () => {
      if (currentMode !== 'FACE' || video.paused || video.ended) return;
      const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks()
        .withFaceDescriptors();
      
      const resized = faceapi.resizeResults(detections, displaySize);
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);

      resized.forEach(d => {
        const match = faceMatcher.findBestMatch(d.descriptor);
        const box = d.detection.box;
        if (match.label !== 'unknown') {
          const st = studentsData.find(s => String(s.id) === match.label);
          const labelText = st ? `${st.grade} เลขที่ ${st.no} ${st.name}` : match.label;
          new faceapi.draw.DrawBox(box, { label: labelText, boxColor: '#198754' }).draw(canvas);
          onScanSuccess(match.label);
        } else {
          new faceapi.draw.DrawBox(box, { label: 'ไม่พบข้อมูลใบหน้า', boxColor: '#dc3545' }).draw(canvas);
        }
      });
    }, 600);
  }

  function loadData() {
    fetch(SCRIPT_URL + "?action=getStudents")
      .then(res => res.json())
      .then(data => {
        studentsData = data;
        renderList();
        prepareQRCards();
      });
  }

  function selectGrade(grade, btn) {
    currentGrade = grade;
    document.querySelectorAll('.grade-btn').forEach(b => {
      b.classList.remove('btn-primary');
      b.classList.add('btn-light');
    });
    btn.classList.remove('btn-light');
    btn.classList.add('btn-primary');
    document.getElementById('print-label').innerText = (grade === 'ALL') ? 'ทั้งหมด' : grade;
    renderList();
    prepareQRCards();
  }

  function renderList() {
    const keyword = document.getElementById('search-box').value.toLowerCase();
    const listArea = document.getElementById('student-list');
    listArea.innerHTML = '';
    let cP = 0, cL = 0, cLv = 0, cA = 0;

    studentsData.forEach(s => {
      if (currentGrade !== 'ALL' && s.grade !== currentGrade) return;
      if (s.status === 'มาเรียน') cP++;
      else if (s.status === 'มาสาย') cL++;
      else if (s.status === 'ลา') cLv++;
      else if (s.status === 'ขาดเรียน') cA++;

      if (!s.name.toLowerCase().includes(keyword) && !String(s.no).includes(keyword)) return;

      let cardBorder = '';
      let badge = 'bg-secondary';
      if (s.status === 'มาเรียน') { cardBorder = 'st-present'; badge = 'bg-success'; }
      else if (s.status === 'มาสาย') { cardBorder = 'st-late'; badge = 'bg-warning text-dark'; }
      else if (s.status === 'ลา') { cardBorder = 'st-leave'; badge = 'bg-info text-dark'; }
      else if (s.status === 'ขาดเรียน') { cardBorder = 'st-absent'; badge = 'bg-danger'; }

      listArea.innerHTML += `
        <div class="student-card ${cardBorder}">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
              <span class="badge bg-dark me-1">${s.grade}</span>
              <span class="fw-bold text-primary">เลขที่ ${s.no}</span>
              <div class="fw-bold fs-6 mt-1">${s.name}</div>
              <small class="text-muted">รหัส: ${s.id} | เวลาสแกน: ${s.time}</small>
            </div>
            <span class="badge ${badge} px-2 py-2 fs-6">${s.status}</span>
          </div>
          <div class="d-flex gap-1 mt-2">
            <button class="btn btn-outline-success btn-action" onclick="updateStatus('${s.id}', 'มาเรียน')">มา</button>
            <button class="btn btn-outline-warning btn-action" onclick="updateStatus('${s.id}', 'มาสาย')">สาย</button>
            <button class="btn btn-outline-info btn-action" onclick="manualLeave('${s.id}')">ลา</button>
            <button class="btn btn-outline-danger btn-action" onclick="updateStatus('${s.id}', 'ขาดเรียน')">ขาด</button>
          </div>
        </div>`;
    });

    document.getElementById('cnt-present').innerText = cP;
    document.getElementById('cnt-late').innerText = cL;
    document.getElementById('cnt-leave').innerText = cLv;
    document.getElementById('cnt-absent').innerText = cA;
  }

  function prepareQRCards() {
    const area = document.getElementById('qr-print-area');
    const title = document.getElementById('print-title');
    title.innerText = (currentGrade === 'ALL') ? 'บัตร QR Code ประจำตัวนักเรียน (ม.1 - ม.3)' : `บัตร QR Code ประจำตัวนักเรียนชั้น ${currentGrade}`;
    area.innerHTML = '';

    const filtered = studentsData.filter(s => currentGrade === 'ALL' || s.grade === currentGrade);
    filtered.forEach(s => {
      const qrUrl = `https://quickchart.io/qr?size=120&text=${encodeURIComponent(s.id)}`;
      area.innerHTML += `
        <div class="col-3">
          <div class="card-qr">
            <img src="${qrUrl}" width="100" height="100" alt="${s.id}">
            <div class="fw-bold mt-1">${s.grade} เลขที่ ${s.no}</div>
            <div style="font-size: 12px;">${s.name}</div>
            <small class="text-muted">${s.id}</small>
          </div>
        </div>
      `;
    });
  }

  function onScanSuccess(decodedText) {
    const now = Date.now();
    if (decodedText === lastScannedId && (now - lastScanTime) < 4000) return;
    lastScannedId = decodedText;
    lastScanTime = now;

    playBeep();
    updateStatus(decodedText, null);
  }

  function updateStatus(studentId, status, note = '') {
    const alertBox = document.getElementById('scan-alert');
    alertBox.className = 'alert alert-warning mt-2 mb-0 py-2 fw-bold small';
    alertBox.innerText = `กำลังบันทึก ${studentId}...`;

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'record', studentId: studentId, status: status, note: note })
    })
    .then(res => res.json())
    .then(res => {
      if (res.success) {
        alertBox.className = 'alert alert-success mt-2 mb-0 py-2 fw-bold small';
        alertBox.innerText = `✓ [${res.student.grade}] เลขที่ ${res.student.no} ${res.student.name} (${res.status} - ${res.time})`;
        const idx = studentsData.findIndex(s => s.id === res.student.id);
        if (idx !== -1) {
          studentsData[idx].status = res.status;
          studentsData[idx].time = res.time;
          renderList();
        }
      } else {
        alertBox.className = 'alert alert-danger mt-2 mb-0 py-2 fw-bold small';
        alertBox.innerText = res.message;
      }
    });
  }

  function manualLeave(id) {
    const note = prompt("ระบุเหตุผลการลา (เช่น ลาป่วย / ลากิจ):", "ลาป่วย");
    if (note !== null) updateStatus(id, 'ลา', note);
  }

  function closeAttendance() {
    const labelText = (currentGrade === 'ALL') ? 'ทั้งหมดทุกชั้น' : `ชั้น ${currentGrade}`;
    if (!confirm(`ยืนยันปรับสถานะคนที่ยังไม่เช็กชื่อของ [${labelText}] เป็น 'ขาดเรียน' ใช่หรือไม่?`)) return;
    
    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'close', grade: currentGrade })
    })
    .then(res => res.json())
    .then(res => {
      alert(`ปรับสถานะเป็นขาดเรียนเรียบร้อยแล้วจำนวน ${res.count} คน`);
      loadData();
    });
  }

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch (e) {}
  }
</script>
</body>
</html>
